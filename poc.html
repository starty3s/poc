<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Web Shell Launcher</title>
  
  <!-- Pengaturan jendela HTA agar rapi seperti aplikasi -->
  <hta:application 
    id="cmdLauncher"
    applicationname="CMD Launcher"
    border="thin"
    caption="yes"
    showintaskbar="yes"
    singleinstance="yes"
    windowstate="normal"
  />

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 90vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
      width: 320px;
    }
    button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.8rem 1.8rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0284c7;
      color: white;
    }
    .status {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>

  <!-- Script VBScript langsung menjalankan CMD di Windows -->
  <script language="VBScript">
    Sub BukaCMD()
      Set objShell = CreateObject("WScript.Shell")
      ' Membuka CMD asli di direktori user
      objShell.Run "cmd.exe /k cd %USERPROFILE%", 1, False
      
      document.getElementById("status").innerText = "Command Prompt berhasil dibuka!"
    End Sub
  </script>
</head>
<body>

  <div class="card">
    <h2>Web Shell Launcher</h2>
    <p>Klik tombol di bawah untuk membuka Command Prompt di komputer Anda.</p>
    <button onclick="BukaCMD()">Buka Real CMD</button>
    <div id="status" class="status"></div>
  </div>

</body>
</html>
