<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <title>Windows CMD Web Terminal</title>

  <hta:application 
    id="cmdTerminal"
    applicationname="Web CMD Terminal"
    border="thin"
    caption="yes"
    showintaskbar="yes"
    singleinstance="yes"
    windowstate="normal"
  />

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0c0c0c;
      color: #cccccc;
      font-family: 'Consolas', 'Courier New', monospace;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 98vh;
    }
    #header {
      background: #1f1f1f;
      color: #38bdf8;
      padding: 8px 12px;
      font-size: 0.85rem;
      border: 1px solid #333;
      border-bottom: none;
      display: flex;
      justify-content: space-between;
    }
    #terminal-body {
      flex: 1;
      background: #0c0c0c;
      border: 1px solid #333;
      padding: 12px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.9rem;
    }
    .input-line {
      display: flex;
      margin-top: 8px;
    }
    .prompt {
      color: #4ade80;
      margin-right: 8px;
    }
    #cmd-input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: inherit;
      flex: 1;
      outline: none;
    }
  </style>

  <script>
    var shell = new ActiveXObject("WScript.Shell");
    var currentDir = shell.ExpandEnvironmentStrings("%USERPROFILE%");
    var commandHistory = [];
    var historyIndex = -1;

    function initTerminal() {
      updatePrompt();
      appendOutput("Microsoft Windows [Version 10.0]\n(c) Web CMD Terminal (Standalone HTA Edition)\n\n");
    }

    function updatePrompt() {
      document.getElementById("prompt-path").innerText = currentDir + ">";
    }

    function appendOutput(text) {
      var output = document.getElementById("output");
      output.innerText += text;
      scrollToBottom();
    }

    function handleKeyPress(e) {
      if (e.keyCode === 13) { // Enter
        var inputElem = document.getElementById("cmd-input");
        var command = inputElem.value.trim();

        if (command !== "") {
          commandHistory.push(command);
          historyIndex = commandHistory.length;
          
          appendOutput(currentDir + "> " + command + "\n");
          inputElem.value = "";

          // Handle perintah 'cls'
          if (command.toLowerCase() === "cls") {
            document.getElementById("output").innerText = "";
            return;
          }

          // Handle perintah 'cd' secara internal agar path tetap tersimpan
          if (command.toLowerCase().substr(0, 3) === "cd " || command.toLowerCase() === "cd") {
            changeDirectory(command.substr(3).trim());
            return;
          }

          // Jalankan perintah via CMD / PowerShell di background
          runSystemCommand(command);
        } else {
          appendOutput(currentDir + ">\n");
        }
      } else if (e.keyCode === 38) { // Panah Atas (History)
        if (historyIndex > 0) {
          historyIndex--;
          document.getElementById("cmd-input").value = commandHistory[historyIndex];
        }
      } else if (e.keyCode === 40) { // Panah Bawah (History)
        if (historyIndex < commandHistory.length - 1) {
          historyIndex++;
          document.getElementById("cmd-input").value = commandHistory[historyIndex];
        } else {
          historyIndex = commandHistory.length;
          document.getElementById("cmd-input").value = "";
        }
      }
    }

    function changeDirectory(newPath) {
      if (!newPath) {
        appendOutput(currentDir + "\n\n");
        return;
      }
      try {
        var exec = shell.Exec('cmd.exe /c "cd /d "' + currentDir + '" && cd /d "' + newPath + '" && cd"');
        var result = exec.StdOut.ReadAll().trim();
        if (result) {
          currentDir = result;
          updatePrompt();
        }
      } catch (err) {
        appendOutput("System cannot find the path specified.\n\n");
      }
    }

    function runSystemCommand(cmd) {
      try {
        // Eksekusi CMD dari direktori aktif
        var exec = shell.Exec('cmd.exe /c "cd /d "' + currentDir + '" && ' + cmd + '"');
        
        var stdout = exec.StdOut.ReadAll();
        var stderr = exec.StdErr.ReadAll();

        if (stdout) appendOutput(stdout);
        if (stderr) appendOutput(stderr);
        appendOutput("\n");
      } catch (err) {
        appendOutput("Error executing command: " + err.message + "\n\n");
      }
    }

    function scrollToBottom() {
      var terminal = document.getElementById("terminal-body");
      terminal.scrollTop = terminal.scrollHeight;
    }
  </script>
</head>
<body onload="initTerminal()">

  <div id="header">
    <span>Standalone CMD Web Terminal</span>
    <span>Ready</span>
  </div>

  <div id="terminal-body" onclick="document.getElementById('cmd-input').focus()">
    <div id="output"></div>
    <div class="input-line">
      <span id="prompt-path" class="prompt"></span>
      <input type="text" id="cmd-input" onkeydown="handleKeyPress(event)" autofocus autocomplete="off" spellcheck="false">
    </div>
  </div>

</body>
</html>
