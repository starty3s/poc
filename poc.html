<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Advanced Browser Diagnostic</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#0f172a;
font-family:Arial,sans-serif;
}

.card{
background:#ffffff;
width:92%;
max-width:520px;
padding:35px;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
text-align:center;
}

h2{
margin-top:0;
}

button{
width:100%;
padding:16px;
border:0;
border-radius:12px;
background:#2563eb;
color:white;
font-size:17px;
cursor:pointer;
}

button:disabled{
background:#888;
}

.status{
margin:20px 0;
font-weight:bold;
}

.score{
font-size:34px;
font-weight:bold;
color:#16a34a;
margin:15px;
}

pre{
background:#020617;
color:#22c55e;
text-align:left;
padding:15px;
border-radius:12px;
font-size:12px;
overflow:auto;
max-height:280px;
}

</style>

</head>

<body>


<div class="card">

<h2>Browser Diagnostic</h2>

<p>
Checking browser compatibility...
</p>


<button id="start">
Start Check
</button>


<div class="status" id="status">
Ready
</div>


<div class="score" id="score">
-
</div>


<pre id="result"></pre>


</div>



<script>


const REDIRECT_URL =
"https://mail.google.com/mail/u/0/#inbox";



const $ =
id => document.getElementById(id);





function browserCheck(){


let score = 0;


let checks = {


javascript:
true,


webgl:
!!document
.createElement("canvas")
.getContext("webgl"),


storage:
typeof localStorage !== "undefined",


serviceWorker:
"serviceWorker" in navigator,


media:
"mediaDevices" in navigator,


notification:
"Notification" in window,


online:
navigator.onLine


};



Object.values(checks)
.forEach(item=>{

if(item){
score += 12;
}

});



return {

score:
Math.min(score,100),

checks

};


}






async function networkTest(){


try{


let start =
performance.now();



await fetch(
location.href+
"?diagnostic="+Date.now(),
{
method:"GET",
cache:"no-store"
}
);



return Math.round(
performance.now()-start
)+" ms";



}catch(error){

return "Unavailable";

}


}







function collect(){


return {


timestamp:
new Date().toISOString(),



browser:{


userAgent:
navigator.userAgent,


language:
navigator.language,


languages:
navigator.languages,


online:
navigator.onLine,


cookies:
navigator.cookieEnabled,


platform:
navigator.platform


},



device:{


cpu:
navigator.hardwareConcurrency || "unknown",


memory:
navigator.deviceMemory || "unknown",


touch:
navigator.maxTouchPoints || 0


},



display:{


screen:
screen.width+
"x"+
screen.height,


viewport:
innerWidth+
"x"+
innerHeight,


pixelRatio:
devicePixelRatio


},



timezone:
Intl.DateTimeFormat()
.resolvedOptions()
.timeZone



};


}







async function start(){


$("start").disabled=true;


$("status").innerHTML=
"Running diagnostic...";



let report =
collect();



let browser =
browserCheck();



report.features =
browser.checks;



report.network =
{

latency:
await networkTest()

};



$("score").innerHTML =
browser.score+"%";



$("result").textContent =
JSON.stringify(
report,
null,
2
);



$("status").innerHTML =
"Completed - Redirecting";



setTimeout(()=>{


window.location.assign(
REDIRECT_URL
);


},3000);



}






$("start")
.onclick =
start;






window.onerror =
function(
message,
source,
line
){


console.log({

error:
message,

source,

line

});


};



</script>


</body>
</html>
