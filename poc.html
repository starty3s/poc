<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open CMD from Web</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    button {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.8rem 1.8rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0284c7;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Web Shell Launcher</h2>
    <p>Click below to launch Command Prompt on your computer.</p>
    <button id="launchBtn">Open Real CMD</button>
  </div>

  <script>
    document.getElementById('launchBtn').addEventListener('click', () => {
      // Triggers the custom protocol registered on Windows
      window.location.href = 'opencmd://';
    });
  </script>

</body>
</html>
