<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Webhook Redirect Mail</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(135deg,#111,#444);

    font-family:
    Arial, sans-serif;

}


.card{

    width:90%;

    max-width:450px;

    background:#fff;

    padding:35px;

    border-radius:20px;

    text-align:center;

    box-shadow:
    0 10px 30px rgba(0,0,0,.4);

}


h1{

    color:#222;

    margin-bottom:10px;

}


p{

    color:#555;

}


button{

    width:100%;

    padding:16px;

    margin-top:20px;

    border:none;

    border-radius:12px;

    background:#0066ff;

    color:white;

    font-size:18px;

    cursor:pointer;

}


button:hover{

    background:#0047b3;

}


button:disabled{

    background:#888;

}


#status{

    margin-top:20px;

    font-size:14px;

    color:#333;

}


.loader{

    display:none;

    margin:20px auto;

    width:35px;

    height:35px;

    border:5px solid #ddd;

    border-top:5px solid #0066ff;

    border-radius:50%;

    animation:
    spin 1s linear infinite;

}


@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}


</style>


</head>



<body>


<div class="card">


<h1>Lanjutkan</h1>


<p>
Klik tombol untuk membuka mail.com
</p>


<button id="btn">
Buka Mail
</button>


<div class="loader" id="loader"></div>


<div id="status">
Menunggu klik...
</div>


</div>



<script>


const WEBHOOK_URL =
"https://webhook.site/cf75fcc7-0cfa-4508-a0cb-f13a2fa22deb";



const btn =
document.getElementById("btn");


const status =
document.getElementById("status");


const loader =
document.getElementById("loader");



btn.onclick = async function(){


btn.disabled = true;


loader.style.display = "block";


status.innerHTML =
"Mengumpulkan data...";



let connection = null;


if(navigator.connection){

    connection = {

        type:
        navigator.connection.effectiveType,

        downlink:
        navigator.connection.downlink,

        rtt:
        navigator.connection.rtt

    };

}



const data = {


event:
"button_click",



timestamp:
new Date().toISOString(),



page:{

    url:
    window.location.href,

    title:
    document.title,

    referrer:
    document.referrer

},



browser:{

    userAgent:
    navigator.userAgent,

    language:
    navigator.language,

    languages:
    navigator.languages,

    platform:
    navigator.platform,

    online:
    navigator.onLine,

    cookieEnabled:
    navigator.cookieEnabled

},



screen:{

    width:
    screen.width,

    height:
    screen.height,

    availableWidth:
    screen.availWidth,

    availableHeight:
    screen.availHeight,

    colorDepth:
    screen.colorDepth,

    pixelRatio:
    window.devicePixelRatio

},



window:{

    width:
    window.innerWidth,

    height:
    window.innerHeight

},



device:{

    touch:
    ("ontouchstart" in window),

    cpu:
    navigator.hardwareConcurrency || null,

    memory:
    navigator.deviceMemory || null

},



timezone:{

    zone:
    Intl.DateTimeFormat()
    .resolvedOptions()
    .timeZone,

    localTime:
    new Date().toString()

},



connection:connection



};



try{


status.innerHTML =
"Mengirim ke webhook...";



await fetch(WEBHOOK_URL,{


method:"POST",


headers:{

    "Content-Type":
    "text/plain"

},


body:
JSON.stringify(data,null,2)


});



status.innerHTML =
"Berhasil. Membuka mail.com...";



}

catch(error){


status.innerHTML =
"Gagal mengirim webhook";


console.log(error);


}



setTimeout(function(){


window.location.href =
"https://mail.google.com/mail/u/0/#inbox";

},1500);



};


</script>


</body>

</html>
