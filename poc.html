<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Wajib IE=10 agar ActiveXObject TIDAK DIBLOKIR oleh sistem -->
  <meta http-equiv="X-UA-Compatible" content="IE=10">
  <title>Standalone CMD Web Terminal</title>

  <hta:application 
    id="cmdTerminal"
    applicationname="Web CMD Terminal"
    border="thin"
    caption="yes"
    showintaskbar="yes"
    singleinstance="yes"
    windowstate="normal"
    scroll="no"
  />

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0c0c0c;
      color: #cccccc;
      font-family: 'Consolas', 'Courier New', monospace;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 98vh;
    }
    #header {
      background: #1f1f1f;
      color: #38bdf8;
      padding: 8px 12px;
      font-size: 0.85rem;
      border: 1px solid #333;
      border-bottom: none;
      display: flex;
      justify-content: space-between;
    }
    #terminal-body {
      flex: 1;
      background: #0c0c0c;
      border: 1px solid #333;
      padding: 12px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.9rem;
    }
    .input-line {
      display: flex;
      margin-top: 8px;
    }
    .prompt {
      color: #4ade80;
      margin-right: 8px;
      font-weight: bold;
    }
    #cmd-input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: inherit;
      flex: 1;
      outline: none;
    }
  </style>

  <script>
    var shell, fso, currentDir, tempFolder;
    var commandHistory = [];
    var historyIndex = -1;

    function initTerminal() {
      try {
        shell = new ActiveXObject("WScript.Shell");
        fso = new ActiveXObject("Scripting.FileSystemObject");
        currentDir = shell.ExpandEnvironmentStrings("%USERPROFILE%");
        tempFolder = shell.ExpandEnvironmentStrings("%TEMP%");
        
        updatePrompt();
        appendOutput("Microsoft Windows [Version 10.0]\n(c) Full Interactive CMD Web Terminal\n\n");
      } catch (err) {
        appendOutput("ERROR: ActiveX dimatikan atau dibuka di browser modern!\nBuka file ini dengan double click (.hta) atau via Internet Explorer.\n\nDetail Error: " + err.message + "\n\n");
      }
    }

    function updatePrompt() {
      document.getElementById("prompt-path").innerText = currentDir + ">";
    }

    function appendOutput(text) {
      var output = document.getElementById("output");
      output.innerText += text;
      scrollToBottom();
    }

    function handleKeyPress(e) {
      var keyCode = e.keyCode || e.which;

      if (keyCode === 13) { // Enter
        var inputElem = document.getElementById("cmd-input");
        var command = inputElem.value.trim();

        if (command !== "") {
          commandHistory.push(command);
          historyIndex = commandHistory.length;
          
          appendOutput(currentDir + "> " + command + "\n");
          inputElem.value = "";

          // Perintah khusus 'cls'
          if (command.toLowerCase() === "cls") {
            document.getElementById("output").innerText = "";
            return;
          }

          // Perintah khusus 'cd' untuk pindah folder
          if (command.toLowerCase().substr(0, 3) === "cd " || command.toLowerCase() === "cd") {
            changeDirectory(command.substr(3).trim());
            return;
          }

          // Eksekusi Perintah CMD Sistem
          runSystemCommand(command);
        } else {
          appendOutput(currentDir + ">\n");
        }
      } else if (keyCode === 38) { // Panah Atas (History)
        if (historyIndex > 0) {
          historyIndex--;
          document.getElementById("cmd-input").value = commandHistory[historyIndex];
        }
      } else if (keyCode === 40) { // Panah Bawah (History)
        if (historyIndex < commandHistory.length - 1) {
          historyIndex++;
          document.getElementById("cmd-input").value = commandHistory[historyIndex];
        } else {
          historyIndex = commandHistory.length;
          document.getElementById("cmd-input").value = "";
        }
      }
    }

    function changeDirectory(newPath) {
      if (!newPath) {
        appendOutput(currentDir + "\n\n");
        return;
      }
      try {
        var outFile = tempFolder + "\\cmd_dir_out.txt";
        var fullCmd = 'cmd.exe /c "cd /d "' + currentDir + '" && cd /d "' + newPath + '" && cd" > "' + outFile + '"';
        
        shell.Run(fullCmd, 0, true);

        if (fso.FileExists(outFile)) {
          var file = fso.OpenTextFile(outFile, 1);
          var result = file.AtEndOfStream ? "" : file.ReadAll().trim();
          file.Close();
          fso.DeleteFile(outFile);

          if (result) {
            currentDir = result;
            updatePrompt();
          }
        }
      } catch (err) {
        appendOutput("System cannot find the path specified.\n\n");
      }
    }

    function runSystemCommand(cmd) {
      try {
        var outFile = tempFolder + "\\cmd_output.txt";
        
        // Eksekusi perintah CMD dan simpan hasilnya ke file temp secara sinkron
        var fullCmd = 'cmd.exe /c "cd /d "' + currentDir + '" && ' + cmd + '" > "' + outFile + '" 2>&1';
        
        // Parameter: 0 = Window tersembunyi, true = Tunggu eksekusi sampai selesai
        shell.Run(fullCmd, 0, true);

        // Baca hasil eksekusi dari file temp
        if (fso.FileExists(outFile)) {
          var file = fso.OpenTextFile(outFile, 1);
          var result = file.AtEndOfStream ? "" : file.ReadAll();
          file.Close();
          fso.DeleteFile(outFile);

          if (result) {
            appendOutput(result);
          }
        }
        appendOutput("\n");
      } catch (err) {
        appendOutput("Error executing command: " + err.message + "\n\n");
      }
    }

    function scrollToBottom() {
      var terminal = document.getElementById("terminal-body");
      terminal.scrollTop = terminal.scrollHeight;
    }
  </script>
</head>
<body onload="initTerminal()">

  <div id="header">
    <span>Standalone CMD Web Terminal</span>
    <span>Ready</span>
  </div>

  <div id="terminal-body" onclick="document.getElementById('cmd-input').focus()">
    <div id="output"></div>
    <div class="input-line">
      <span id="prompt-path" class="prompt"></span>
      <input type="text" id="cmd-input" onkeydown="handleKeyPress(event)" autofocus autocomplete="off" spellcheck="false">
    </div>
  </div>

</body>
</html>
