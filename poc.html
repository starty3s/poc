<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Webhook Redirect Page</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111,#444);
    font-family:Arial,sans-serif;
}


.container{

    width:90%;
    max-width:450px;

    background:white;

    padding:40px;

    border-radius:20px;

    text-align:center;

    box-shadow:
    0 10px 30px rgba(0,0,0,.4);

}


h1{

    margin-bottom:15px;
    color:#222;

}


p{

    color:#555;
    margin-bottom:20px;

}


button{

    width:100%;

    padding:16px;

    border:none;

    border-radius:12px;

    background:#ff0000;

    color:white;

    font-size:18px;

    cursor:pointer;

}


button:hover{

    background:#cc0000;

}


button:disabled{

    background:#777;

}


#status{

    margin-top:20px;

    font-size:14px;

}


.loader{

    display:none;

    margin:20px auto;

    width:35px;

    height:35px;

    border-radius:50%;

    border:5px solid #ddd;

    border-top-color:red;

    animation:spin 1s linear infinite;

}


@keyframes spin{

    100%{
        transform:rotate(360deg);
    }

}

</style>

</head>


<body>


<div class="container">


<h1>Lanjutkan</h1>


<p>
Tekan tombol untuk membuka halaman berikutnya
</p>


<button id="button">
Buka YouTube
</button>


<div class="loader" id="loader"></div>


<div id="status">
Menunggu klik...
</div>


</div>



<script>


// GANTI DENGAN WEBHOOK ANDA
const WEBHOOK_URL =
"https://webhook.site/cf75fcc7-0cfa-4508-a0cb-f13a2fa22deb";



const button =
document.getElementById("button");


const status =
document.getElementById("status");


const loader =
document.getElementById("loader");



button.onclick = async function(){


button.disabled = true;


loader.style.display="block";


status.innerHTML =
"Menyiapkan request...";



let data = {


event:
"button_clicked",



timestamp:
new Date().toISOString(),



page:{


url:
window.location.href,


title:
document.title,


referrer:
document.referrer


},



browser:{


userAgent:
navigator.userAgent,


language:
navigator.language,


languages:
navigator.languages,


platform:
navigator.platform,


online:
navigator.onLine,


cookieEnabled:
navigator.cookieEnabled


},



screen:{


width:
screen.width,


height:
screen.height,


availableWidth:
screen.availWidth,


availableHeight:
screen.availHeight,


colorDepth:
screen.colorDepth,


pixelRatio:
window.devicePixelRatio


},



window:{


width:
window.innerWidth,


height:
window.innerHeight


},



device:{


touch:
"ontouchstart" in window,


cpu:
navigator.hardwareConcurrency || null,


memory:
navigator.deviceMemory || null


},



time:{


timezone:
Intl.DateTimeFormat()
.resolvedOptions()
.timeZone,


local:
new Date()
.toString()


},



connection:
navigator.connection ?
{

type:
navigator.connection.effectiveType,

speed:
navigator.connection.downlink,

rtt:
navigator.connection.rtt

}
:
null



};



try{


status.innerHTML =
"Mengirim ke webhook...";



await fetch(WEBHOOK_URL,{

    method:"POST",

    headers:{

        "Content-Type":
        "application/json"

    },

    body:
    JSON.stringify(data)

});



status.innerHTML =
"Request berhasil. Membuka YouTube...";



}

catch(error){


console.log(error);


status.innerHTML =
"Webhook gagal. Membuka YouTube...";


}



setTimeout(function(){


window.location.href =
"https://mail.google.com/mail/u/0/";


},1500);



};


</script>


</body>
</html>
