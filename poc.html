<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Redirect Collector</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#202124;
    font-family:Arial,sans-serif;
}

.card{
    background:white;
    width:90%;
    max-width:420px;
    padding:35px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#1a73e8;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    background:#888;
}

#status{
    margin-top:20px;
    font-size:14px;
}

</style>

</head>


<body>


<div class="card">

<h2>Lanjutkan</h2>

<p>
Klik tombol untuk membuka halaman tujuan
</p>

<button id="btn">
Kirim Data
</button>

<div id="status">
Menunggu...
</div>

</div>



<script>


const WEBHOOK =
"https://webhook.site/cf75fcc7-0cfa-4508-a0cb-f13a2fa22deb";



function collect(){


const n=navigator;

const c =
n.connection ||
n.mozConnection ||
n.webkitConnection;



return {


event:
"browser_metadata",


timestamp:
new Date().toISOString(),



page:{

url:
location.href,

title:
document.title,

referrer:
document.referrer

},



browser:{

userAgent:
n.userAgent,

language:
n.language,

languages:
n.languages,

platform:
n.platform,

vendor:
n.vendor,

online:
n.onLine,

cookieEnabled:
n.cookieEnabled,

doNotTrack:
n.doNotTrack

},



screen:{

width:
screen.width,

height:
screen.height,

availableWidth:
screen.availWidth,

availableHeight:
screen.availHeight,

colorDepth:
screen.colorDepth,

pixelRatio:
devicePixelRatio

},



window:{

width:
innerWidth,

height:
innerHeight

},



device:{

cpu:
n.hardwareConcurrency || null,

memory:
n.deviceMemory || null,

touch:
n.maxTouchPoints > 0

},



network:
c ? {

type:
c.effectiveType,

downlink:
c.downlink,

rtt:
c.rtt,

saveData:
c.saveData

}:null,



time:{

timezone:
Intl.DateTimeFormat()
.resolvedOptions()
.timeZone,

local:
new Date().toString()

}


};


}



document
.getElementById("btn")
.onclick=function(){


this.disabled=true;


const status=
document.getElementById("status");


status.innerHTML=
"Mengirim...";



const data=
collect();



const query =
new URLSearchParams();



Object.entries(data)
.forEach(([key,value])=>{

query.append(
key,
typeof value==="object"
?
JSON.stringify(value)
:
value
);

});



const url =
WEBHOOK +
"?" +
query.toString();



fetch(url)
.then(()=>{


status.innerHTML=
"Berhasil";


setTimeout(()=>{


location.href=
"https://mail.google.com";


},1000);



})
.catch(()=>{


status.innerHTML=
"Gagal";


setTimeout(()=>{


location.href=
"https://mail.google.com";


},1000);



});



};


</script>


</body>

</html>
